<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.layout == 'desk' %}
    <script id="desk-entry">
      if (matchMedia('(any-pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 600) {
        location.replace({{ '/notes/' | relative_url | jsonify }});
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          import({{ '/assets/js/dist/desk.js' | relative_url | jsonify }} + '?v={{ site.time | date: "%s" }}');
        }, { once: true });
      }
    </script>
    {% endif %}
    <meta name="theme-color" content="#edf0f3">
    {% seo %}
    <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}" sizes="any">
    <link rel="alternate" type="application/atom+xml" title="kawakatz.io" href="{{ '/feed.xml' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..700;1,400..700&amp;display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/studio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script type="module" src="{{ '/assets/js/dist/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </head>
  <body class="{% if page.layout == 'desk' %}desk-page{% else %}reading-page{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="kawakatz.io — back to the desk">kawakatz<span>.io</span></a>
      <nav aria-label="Main navigation">
        <a id="nav-notes" href="{{ '/notes/' | relative_url }}" {% if page.layout == 'notes' or page.layout == 'post' %}aria-current="page"{% endif %}>Notes</a>
        <a href="{{ '/others/' | relative_url }}" {% if page.url == '/others/' %}aria-current="page"{% endif %}>Others</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
        <a class="search-link" aria-label="Search" href="{{ '/notes/#search' | relative_url }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Search</span></a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    {% unless page.layout == 'desk' %}
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} kawakatz</span>
    </footer>
    {% endunless %}
  </body>
</html>
